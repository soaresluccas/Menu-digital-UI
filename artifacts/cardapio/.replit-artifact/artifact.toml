kind = "web"
previewPath = "/"
title = "Cardápio — Nossa Noite"
version = "1.0.0"
id = "artifacts/cardapio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24945

[services.development]
run = "pnpm --filter @workspace/cardapio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cardapio", "run", "build" ]
publicDir = "artifacts/cardapio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24945"
BASE_PATH = "/"
